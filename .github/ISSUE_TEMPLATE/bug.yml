name: Bug 报告
description: 报告可以重复的输入、候选、光标、模型或安装问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请提供最短、逐键可重复的步骤。不要粘贴 API Key、密码或不希望公开的监督内容。
  - type: input
    id: app
    attributes:
      label: 应用和版本
      placeholder: 例如 Firefox 140、Alacritty 0.15
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: 桌面环境、compositor 和缩放
      placeholder: 例如 niri，Wayland，150%
    validations:
      required: true
  - type: dropdown
    id: frontend
    attributes:
      label: 输入前端
      options:
        - Wayland input-method-v2
        - DBus / GTK
        - XIM / Xwayland
        - Wine
        - 不确定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 逐键复现步骤
      description: 写出拼音、候选选择、方向键和最终状态。
      placeholder: |
        1. 输入 nihao
        2. 选择“你”
        3. 预期剩余 hao，实际……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: 状态探针或诊断信息
      description: 可粘贴最小动作脚本和 tipe-doctor 相关行，请先移除私人内容。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认内容中没有 API Key、密码和不希望公开的私人文字
          required: true
        - label: 我已尽量缩小到最短复现步骤
          required: true
